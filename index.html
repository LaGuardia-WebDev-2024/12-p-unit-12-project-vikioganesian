<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Quiz About Viki</h1>
    <hr />
    <!-- Movie Question -->
    <form id="movie-form">
      <label>
        🥤 What is my favorite drink?
        <select id="movie-answer">
          <option value="movie1">Coke</option>
          <option value="movie2">Monster</option>
          <option value="movie3">Red Bull</option>
          <option value="movie4">Celsius</option>
        </select>
      </label>
      <button type="submit">Check Your Answer</button>
    </form>
    <div id="movie-result">
      <p id="movie-text"></p>
       <img id="noMovie" src="https://media.tenor.com/Or_pMDyHdygAAAAe/no-no-no-nope.png" width=" 200">
    <img class="yesMovie" src="https://i.pinimg.com/originals/07/27/73/072773aa34bb00747cc6b5ef661a0bac.gif" width="200">
      </div>
    <hr />
    <!-- Book Question -->
    <form id="book-form">
      <label>
       🧥 What is one of my favorite brands?
        <select id="book-answer">
          <option value="book1">book 1</option>
          <option value="book2">book 2</option>
          <option value="book3">edikted</option>
          <option value="book4">ann demeulemeester</option>
        </select>
      </label>
      <button type="submit">Check Your Answer</button>
    </form>
    <div id="book-result">
      <p id="book-text"></p>
      <img id="yesbook" src="https://i.pinimg.com/originals/13/de/55/13de5511b65ec28d4501d0962a388969.gif" width="200">
       <img id="nobook" src="https://media.tenor.com/Or_pMDyHdygAAAAe/no-no-no-nope.png" width=" 200">
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      


      $("#noMovie").hide()
      $(".yesMovie").hide()
      //========================Movie Question jQuery Code
      $("#movie-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#movie-answer");
        var answer = $answer.val();

        if (answer === "movie3") {
          $("#movie-text").text("YESSSS!");
          $(".yesMovie").fadeIn(2000);
          $("#noMovie").hide(2000);
          }
        
         
        else {
          $("#movie-text").text("Noooo....Try Again!");
         
             $(".yesMovie").hide(2000);
            
              $("#noMovie").show(1500).animate({
            rotate: "95deg",
          }, 1000)

        }
      });


      $("#nobook").hide()
      $("#yesbook").hide()
      //=======================Book Question jQuery Code
      $("#book-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#book-answer");
        var answer = $answer.val();

        if (answer === "book4") {
          $("#book-text").text("YESSSS!");
              $("#yesbook").fadeIn(2000);
                $("#nobook").hide(2000)
        } 
        else {
          $("#book-text").text("Noooo....Try Again!");
              $("#nobook").show(1500).animate({
            rotate: "95deg",
          }, 1000)
             $("#yesbook").hide(2000);
        }
      });
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
